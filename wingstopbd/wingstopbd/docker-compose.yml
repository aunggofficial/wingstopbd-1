version: '3.8'\n\nservices:\n  # Frontend Service\n  frontend:\n    build:\n      context: ./frontend\n      dockerfile: Dockerfile\n    container_name: wingstopbd-frontend\n    ports:\n      - \"3000:3000\"\n    environment:\n      - VITE_API_URL=http://localhost:3001\n    depends_on:\n      - backend\n    networks:\n      - wingstopbd-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"wget\", \"--quiet\", \"--tries=1\", \"--spider\", \"http://localhost:3000\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 5s\n\n  # Backend Service\n  backend:\n    build:\n      context: ./backend\n      dockerfile: Dockerfile\n    container_name: wingstopbd-backend\n    ports:\n      - \"3001:3001\"\n    environment:\n      - NODE_ENV=production\n      - PORT=3001\n      - DB_HOST=postgres\n      - DB_PORT=5432\n      - DB_USER=${DB_USER:-wingstop_user}\n      - DB_PASSWORD=${DB_PASSWORD:-secure_password}\n      - DB_NAME=${DB_NAME:-wingstopbd}\n      - JWT_SECRET=${JWT_SECRET:-your_jwt_secret_key}\n      - STRIPE_SECRET_KEY=${STRIPE_SECRET_KEY}\n      - STRIPE_WEBHOOK_SECRET=${STRIPE_WEBHOOK_SECRET}\n      - FRONTEND_URL=http://localhost:3000\n    depends_on:\n      postgres:\n        condition: service_healthy\n    networks:\n      - wingstopbd-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"curl\", \"-f\", \"http://localhost:3001/health\"]\n      interval: 30s\n      timeout: 10s\n      retries: 3\n      start_period: 10s\n\n  # PostgreSQL Database\n  postgres:\n    image: postgres:15-alpine\n    container_name: wingstopbd-db\n    environment:\n      - POSTGRES_USER=${DB_USER:-wingstop_user}\n      - POSTGRES_PASSWORD=${DB_PASSWORD:-secure_password}\n      - POSTGRES_DB=${DB_NAME:-wingstopbd}\n    volumes:\n      - postgres_data:/var/lib/postgresql/data\n      - ./backend/wingstopbd-database-schema.sql:/docker-entrypoint-initdb.d/schema.sql\n    ports:\n      - \"5432:5432\"\n    networks:\n      - wingstopbd-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD-SHELL\", \"pg_isready -U ${DB_USER:-wingstop_user}\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  # Redis Cache (Optional)\n  redis:\n    image: redis:7-alpine\n    container_name: wingstopbd-redis\n    ports:\n      - \"6379:6379\"\n    volumes:\n      - redis_data:/data\n    networks:\n      - wingstopbd-network\n    restart: unless-stopped\n    healthcheck:\n      test: [\"CMD\", \"redis-cli\", \"ping\"]\n      interval: 10s\n      timeout: 5s\n      retries: 5\n\n  # Nginx Reverse Proxy\n  nginx:\n    image: nginx:alpine\n    container_name: wingstopbd-nginx\n    ports:\n      - \"80:80\"\n      - \"443:443\"\n    volumes:\n      - ./nginx.conf:/etc/nginx/nginx.conf:ro\n      - ./ssl:/etc/nginx/ssl:ro\n    depends_on:\n      - frontend\n      - backend\n    networks:\n      - wingstopbd-network\n    restart: unless-stopped\n\nnetworks:\n  wingstopbd-network:\n    driver: bridge\n\nvolumes:\n  postgres_data:\n  redis_data:\n
